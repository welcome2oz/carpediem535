<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hull 봇 콘솔</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e3e6eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--fg:#e6e8ec;--mute:#9aa1ad;--line:#2a2f3a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--acc:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);font-size:12px;word-break:break-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bot{border:1px solid var(--line);border-radius:10px;padding:12px}
.bot.live{border-color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.on{background:var(--ok)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Consolas,monospace;margin:8px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablewrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card)}
textarea{width:100%;min-height:340px;font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
select,input[type=text]{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90vw}
.switch{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<main>
  <h1>Hull Suite 봇 콘솔</h1>
  <div class="sub" id="dir"></div>
  <div class="sub warn" id="notice"></div>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">봇 실행</h2>
      <label class="switch" title="봇 폴더에 STOP 파일을 만들어 신규 진입만 멈춤">
        <input type="checkbox" id="stopfile"> <b>신규 진입 멈춤 (STOP 파일)</b>
      </label>
    </div>
    <div class="grid" id="bots" style="margin-top:12px"></div>
    <p class="sub">정지 = Ctrl+C와 같음. 보유 포지션과 거래소 손절 주문은 그대로 남습니다. 이 콘솔 창을 끄면 여기서 시작한 봇도 멈춥니다.</p>
  </section>

  <section class="card">
    <div class="row"><h2 style="margin:0">오늘 신호 확인</h2><button id="checkBtn" class="pri">check_signal 실행</button><span class="sub">키 불필요 · 주문 없음</span></div>
    <pre id="checkOut" hidden></pre>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="tabs" id="tabs">
        <button data-tab="journal" class="on">매매 기록</button>
        <button data-tab="log">봇 로그</button>
        <button data-tab="console">콘솔 출력</button>
        <button data-tab="state">상태 파일</button>
        <button data-tab="config">설정</button>
      </div>
      <div class="row">모드 <select id="mode"><option>paper</option><option>demo</option><option>testnet</option><option>live</option></select>
        <button id="refresh">새로고침</button></div>
    </div>
    <div id="view"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const MODES = {paper:"모의", demo:"데모", testnet:"테스트넷", live:"실계정"};
const $ = s => document.querySelector(s);
let tab = "journal";
try { tab = localStorage.getItem("tab") || tab; $("#mode").value = localStorage.getItem("mode") || "paper"; } catch {}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers:{"X-Token":TOKEN}}
    : {method:"POST", headers:{"X-Token":TOKEN,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({error:"응답 오류"}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { if (!t) return "없음"; const m = Math.round((Date.now()/1000 - t)/60); return m < 1 ? "방금" : m < 60 ? m+"분 전" : Math.round(m/60)+"시간 전"; };

async function loadStatus() {
  let s; try { s = await api("/api/status"); } catch (e) { $("#notice").textContent = "웹 콘솔 서버에 연결할 수 없습니다: " + e.message; return; }
  $("#dir").textContent = "봇 폴더: " + s.bot_dir;
  $("#notice").textContent = [!s.bot_found && "bot.py를 찾지 못했습니다. webapp.py를 봇 폴더에 두세요.",
                             !s.env_found && ".env가 없습니다 (모의·신호 확인은 키 없이 가능)."].filter(Boolean).join(" ");
  $("#stopfile").checked = s.stop_file;
  $("#bots").innerHTML = Object.entries(s.bots).map(([m, b]) => `
    <div class="bot ${m==="live"?"live":""}">
      <div class="row" style="justify-content:space-between"><b><span class="dot ${b.running?"on":""}"></span>${MODES[m]} <span class="sub">${m}</span></b>
        <span class="${b.running?"ok":"sub"}">${b.running?"실행 중":"정지"}</span></div>
      <div class="sub">${b.running ? "PID "+b.pid+" · 시작 "+ago(b.started) : b.exit_code!=null ? "종료 코드 "+b.exit_code : "&nbsp;"}</div>
      <div class="sub">마지막 봇 로그: ${ago(b.last_log)}${!b.running && b.last_log && Date.now()/1000-b.last_log<180 ? ' <span class="warn">(다른 곳에서 실행 중일 수 있음)</span>':""}</div>
      <div class="row" style="margin-top:8px">
        ${b.running ? `<button class="danger" onclick="stopBot('${m}')">정지</button>`
          : `<button class="pri" onclick="startBot('${m}')">시작</button>${m!=="live"?`<label class="sub"><input type="checkbox" id="dn_${m}"> 지금 바로 판단</label>`:""}`}
      </div>
    </div>`).join("");
}

async function startBot(m) {
  const b = {mode:m, decide_now: $("#dn_"+m)?.checked};
  if (m === "live") {
    b.confirm = prompt("실계정에서 실제 주문이 나갑니다.\n시작하려면 LIVE 를 입력하세요.");
    if (b.confirm === null) return;
  } else if (b.decide_now && !confirm(`${MODES[m]} 모드에서 지금 바로 신호를 판단해 진입할 수 있습니다. 계속할까요?`)) return;
  try { await api("/api/start", b); toast(MODES[m]+" 봇 시작"); } catch (e) { alert(e.message); }
  loadStatus();
}
async function stopBot(m) {
  if (!confirm(`${MODES[m]} 봇을 정지할까요?\n보유 포지션과 거래소 손절 주문은 남아 있습니다.`)) return;
  try { await api("/api/stop", {mode:m}); toast("정지했습니다"); } catch (e) { alert(e.message); }
  loadStatus();
}
$("#stopfile").onchange = async e => {
  try { await api("/api/stopfile", {on:e.target.checked}); toast(e.target.checked ? "신규 진입 멈춤" : "신규 진입 재개"); }
  catch (err) { alert(err.message); } loadStatus();
};
$("#checkBtn").onclick = async () => {
  const btn = $("#checkBtn"), out = $("#checkOut");
  btn.disabled = true; btn.textContent = "확인 중…"; out.hidden = false; out.textContent = "";
  try { out.textContent = (await api("/api/check", {})).output || "(출력 없음)"; } catch (e) { out.textContent = "오류: " + e.message; }
  btn.disabled = false; btn.textContent = "check_signal 실행";
};

async function loadView() {
  const m = $("#mode").value, v = $("#view");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  try {
    if (tab === "journal") {
      const j = await api("/api/journal?mode=" + m);
      v.innerHTML = !j.header.length ? `<p class="sub">journal_${m}.csv 기록이 아직 없습니다.</p>` :
        `<p class="sub">최신순 ${j.rows.length}건</p><div class="tablewrap"><table><thead><tr>${j.header.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
         <tbody>${j.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (tab === "log" || tab === "console") {
      const j = await api(`/api/log?mode=${m}&kind=${tab==="log"?"bot":"console"}`);
      v.innerHTML = `<p class="sub">logs/${tab==="log"?"bot":"console"}_${m}.log 마지막 ${j.lines.length}줄</p><pre id="logpre">${esc(j.lines.join("\n")) || "(없음)"}</pre>`;
      const p = $("#logpre"); p.scrollTop = p.scrollHeight;
    } else if (tab === "state") {
      const j = await api("/api/state");
      const parts = Object.entries(j.states).map(([n, d]) => `<h2>${esc(n)}</h2><pre>${esc(JSON.stringify(d, null, 2))}</pre>`);
      if (j.paper_account) parts.push(`<h2>paper_account.json</h2><pre>${esc(JSON.stringify(j.paper_account, null, 2))}</pre>`);
      v.innerHTML = parts.join("") || `<p class="sub">state_*.json 파일이 아직 없습니다.</p>`;
    } else if (tab === "config") {
      if ($("#cfg")) return; // 편집 중인 내용을 자동 새로고침으로 덮어쓰지 않음
      const j = await api("/api/config");
      v.innerHTML = `<p class="sub">저장 시 형식·leverage(10 이하)·stop_pct·mode를 검사하고 이전 파일은 config.json.bak으로 보관합니다. 실행 중인 봇은 다시 시작해야 반영될 수 있습니다.</p>
        <textarea id="cfg" spellcheck="false">${esc(j.text)}</textarea>
        <div class="row" style="margin-top:8px"><button class="pri" id="saveCfg">저장</button><button id="reloadCfg">파일에서 다시 읽기</button></div>`;
      $("#saveCfg").onclick = async () => { try { await api("/api/config", {text:$("#cfg").value}); toast("저장했습니다"); $("#view").innerHTML=""; loadView(); } catch (e) { alert(e.message); } };
      $("#reloadCfg").onclick = () => { $("#view").innerHTML = ""; loadView(); };
    }
  } catch (e) { v.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}
$("#tabs").onclick = e => { if (!e.target.dataset.tab) return; tab = e.target.dataset.tab; try{localStorage.setItem("tab",tab)}catch{} $("#view").innerHTML=""; loadView(); };
$("#mode").onchange = () => { try{localStorage.setItem("mode",$("#mode").value)}catch{} if (tab!=="config") loadView(); };
$("#refresh").onclick = () => { $("#view").innerHTML = ""; loadView(); loadStatus(); };

loadStatus(); loadView();
setInterval(loadStatus, 5000);
setInterval(() => { if (tab !== "config") loadView(); }, 15000);
</script>
</body>
</html>
